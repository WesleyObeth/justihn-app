<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.1 1.1 39.9 39.9">
<!-- Favicon = el símbolo oficial (logo/justihn-icon.svg) sin la caja marina,
     con el viewBox recortado a la tinta para que llene la pestaña.
     Geometría, colores y cruce IDÉNTICOS al símbolo: barra marina #0d2144,
     barra celeste #1584c7 y el cruce #0e5f92 donde se solapan. No lleva
     adaptación a modo oscuro: el logo es este y no cambia de color. -->
<defs>
  <clipPath id="jh-fav">
    <rect x="11.15" y="3" width="11.7" height="36" rx="5.85" transform="rotate(-26 17 21)"/>
  </clipPath>
</defs>
<rect x="11.15" y="3" width="11.7" height="36" rx="5.85" fill="#0d2144" transform="rotate(-26 17 21)"/>
<rect x="25.15" y="3" width="11.7" height="36" rx="5.85" fill="#1584c7" transform="rotate(26 31 21)"/>
<g clip-path="url(#jh-fav)">
  <rect x="25.15" y="3" width="11.7" height="36" rx="5.85" fill="#0e5f92" transform="rotate(26 31 21)"/>
</g>
</svg>
